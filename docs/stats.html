<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إحصائيات صلاتي</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one column. Big total, then one row per released version. */
:root{--bg:#F6F2E8;--card:#FFFDF8;--ink:#14302D;--muted:#5D6F6B;--line:#E2DCCD;--teal:#155E59;--gold:#D9A04A;
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0B1716;--card:#12211F;--ink:#E6EEEA;--muted:#97AAA6;--line:#22352F;--teal:#5FC0B4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.6}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:32px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
.total{background:var(--teal);color:#F4FBF9;border-radius:22px;padding:22px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.total b{display:block;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.total{color:#08201D}}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .v{font-weight:600}
.row .d{font-size:13px;color:var(--muted)}
.row .n{font-size:13px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--gold);border-radius:6px;margin-top:4px}
.note{font-size:13px;color:var(--muted)}
button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;align-self:flex-start}
</style>
</head>
<body>
<main>
  <h1>إحصائيات تنزيل صلاتي</h1>
  <div class="totals"><div class="total"><span>تنزيلات جديدة</span><b id="total">…</b><span id="sub"></span></div><div class="total alt"><span>تحديثات من داخل التطبيق</span><b id="upd">…</b><span>&nbsp;</span></div></div>
  <div class="list" id="list"></div>
  <button id="reload">تحديث</button>
  <p class="note"><b>تنزيلات جديدة</b>: من صفحة الإعلان أو من رابط مباشر، وهي أقرب رقم لعدد من ثبّتوا التطبيق (قد يُحتسب من نزّله مرتين).<br><b>تحديثات</b>: من زر «تنزيل التحديث» داخل التطبيق. الإصدارات القديمة قبل هذا الفصل تُحتسب كلها ضمن التنزيلات الجديدة.</p>
</main>
<script>
async function load(){
  const T=document.getElementById("total"),L=document.getElementById("list"),S=document.getElementById("sub");
  T.textContent="…";document.getElementById("upd").textContent="…";L.innerHTML="";S.textContent="";
  try{
    const r=await fetch("https://api.github.com/repos/Moumenkiwan/Salati/releases?per_page=100",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const rel=await r.json();let total=0,updTotal=0;const rows=[];
    for(const x of rel){let n=0,u=0;for(const a of (x.assets||[])){if(a.name==="salati-update.apk")u+=a.download_count;else if(/\.apk$/.test(a.name))n+=a.download_count}
      total+=n;updTotal+=u;
      rows.push({v:(x.name||x.tag_name),d:new Date(x.published_at).toLocaleDateString("ar-JO-u-nu-latn",{day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}),n,u})}
    T.textContent=total.toLocaleString("en");document.getElementById("upd").textContent=updTotal.toLocaleString("en");S.textContent="على "+rel.length+" إصدارات";
    const max=Math.max(1,...rows.map(r=>r.n+r.u));
    rows.forEach(r=>{const d=document.createElement("div");d.className="row";
      d.innerHTML=`<div><div class="v"></div><div class="d"></div><div class="bar" style="width:${Math.max(4,(r.n+r.u)/max*160)}px"></div></div><div class="n"></div>`;
      d.querySelector(".v").textContent=r.v;d.querySelector(".d").textContent=r.d;d.querySelector(".n").textContent=r.n+" جديد · "+r.u+" تحديث";L.appendChild(d)});
  }catch(e){T.textContent="—";document.getElementById("upd").textContent="—";S.textContent="تعذّر جلب الأرقام الآن، حاول بعد قليل."}
}
document.getElementById("reload").onclick=load;load();
</script>
</body>
</html>
